<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CareTrace synthetic clinical documentation safety demo" />
    <meta name="theme-color" content="#08241d" />
    <link rel="icon" type="image/svg+xml" href="/caretrace-mark.svg" />
    <script>
      try {
        const saved = localStorage.getItem('caretrace-theme');
        const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (_) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <title>CareTrace · Clinical Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
